<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="1" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="22.5" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4 8"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="4 8"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke-dasharray="4 8"/>
    <line x1="850" y1="0" x2="850" y2="400" stroke-dasharray="4 8"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke-dasharray="4 8"/>
    <line x1="1150" y1="0" x2="1150" y2="400" stroke-dasharray="4 8"/>
  </g>

  <!-- Category Pill Badge -->
  <g transform="translate(80, 75)">
    <rect width="500" height="36" rx="18" fill="#0C4A6E" stroke="url(#grad)" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#38BDF8"/>
    <text x="36" y="23" fill="#F0F9FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CLINICAL DERMATOLOGY &amp; CONSULTATION API</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="185" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">DERMAINE BACKEND</text>
  <text x="80" y="235" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">Node.js · TypeScript · Express · Prisma ORM · MongoDB · Stripe · AWS S3</text>

  <!-- Tech Highlights Pills -->
  <g transform="translate(80, 275)">
    <rect width="130" height="32" rx="16" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
    <text x="65" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">TypeScript</text>
  </g>
  <g transform="translate(220, 275)">
    <rect width="130" height="32" rx="16" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
    <text x="65" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Prisma ORM</text>
  </g>
  <g transform="translate(360, 275)">
    <rect width="130" height="32" rx="16" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
    <text x="65" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">MongoDB</text>
  </g>
  <g transform="translate(500, 275)">
    <rect width="130" height="32" rx="16" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
    <text x="65" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Stripe</text>
  </g>

  <!-- Isometric Tech Geometric Graphic -->
  <g transform="translate(920, 120)">
    <polygon points="100,20 180,65 100,110 20,65" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="20,65 100,110 100,170 20,125" fill="#075985" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="180,65 100,110 100,170 180,125" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>

    <circle cx="100" cy="20" r="5" fill="#38BDF8"/>
    <circle cx="180" cy="65" r="5" fill="#FFFFFF"/>
    <circle cx="20" cy="65" r="5" fill="#38BDF8"/>
    <circle cx="100" cy="110" r="5" fill="#38BDF8"/>
    <circle cx="100" cy="170" r="5" fill="#38BDF8"/>
  </g>
</svg>
